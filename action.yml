name: "Terraform Plan Verdict"
description: "Score a Terraform plan and post a LOW/MEDIUM/HIGH/CRITICAL risk verdict to your PRs. Free rules, optional AI."
author: "nandotorres"
branding:
  icon: "shield"
  color: "purple"

inputs:
  plan-json:
    description: "Path to the plan JSON: either `terraform show -json tfplan` (single object) or `terraform plan -json` (NDJSON stream)."
    required: true
  provider:
    description: "Judgment provider: 'rules' (free, offline, default), 'systemone' (jev / TypeSafe-compatible), or 'openai' (any OpenAI-compatible endpoint)."
    required: false
    default: "rules"
  api-key:
    description: "API key for the chosen provider. Not needed for 'rules'. Falls back to TYPESAFE_API_KEY / OPENAI_API_KEY."
    required: false
  model:
    description: "Model to use (provider-specific, e.g. 'jev-latest', 'gpt-4o-mini', 'llama3.1')."
    required: false
  base-url:
    description: "API root for the provider. Enables self-hosted or alternative endpoints. Falls back to TYPESAFE_BASE_URL / OPENAI_BASE_URL."
    required: false
  provider-options:
    description: "Optional YAML/JSON pass-through for the provider: 'headers', 'query', and 'body' maps (e.g. Azure api-version, anthropic-version, max_tokens)."
    required: false
  github-token:
    description: "Token used to post comments and apply labels."
    required: false
    default: ${{ github.token }}
  comment:
    description: "Post the verdict as a PR comment ('true' | 'false')."
    required: false
    default: "true"
  comment-mode:
    description: "'upsert' (edit a single sticky comment) | 'new' (always a new comment)."
    required: false
    default: "upsert"
  labels:
    description: "Apply risk labels to the PR ('true' | 'false')."
    required: false
    default: "false"
  label-prefix:
    description: "Prefix for applied labels."
    required: false
    default: "plan/"
  fail-on:
    description: "Fail the job when the verdict is at or above this level: 'none' | 'medium' | 'high' | 'critical'."
    required: false
    default: "none"
  summary:
    description: "Write the verdict to the GitHub step summary ('true' | 'false')."
    required: false
    default: "true"
  max-resources:
    description: "Cap on resource changes sent to jev (controls token usage). 0 = no cap."
    required: false
    default: "200"

outputs:
  verdict:
    description: "Overall verdict: LOW | MEDIUM | HIGH | CRITICAL."
  provider:
    description: "Provider that produced the judgment."
  verdict-confidence:
    description: "jev's reported confidence in the verdict (0..1)."
  overall-score:
    description: "Aggregated risk score, 0..100."
  scores-json:
    description: "Full per-dimension breakdown as JSON."
  data-loss-risk:
    description: "Probability that the plan causes irreversible data loss (0..1)."
  has-destructive-changes:
    description: "'true' if the plan deletes or replaces any resource."
  resources-created:
    description: "Count of resources to be created."
  resources-updated:
    description: "Count of resources to be updated in place."
  resources-deleted:
    description: "Count of resources to be destroyed."
  resources-replaced:
    description: "Count of resources to be replaced (destroy + recreate)."
  comment-url:
    description: "URL of the posted/updated PR comment, if any."

runs:
  using: "node24"
  main: "dist/index.js"
