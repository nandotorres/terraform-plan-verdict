name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deny by default; grant the minimum per job.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts blocks dependency lifecycle scripts during install.
      - run: npm ci --ignore-scripts

      # Gate on dependencies that ship in dist/. Dev-only tooling advisories are
      # tracked via Dependabot but never reach users.
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify committed dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit."
            git diff --stat
            exit 1
          fi
