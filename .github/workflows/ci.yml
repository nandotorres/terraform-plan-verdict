name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deny by default; grant the minimum per job.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts blocks dependency lifecycle scripts during install.
      - run: npm ci --ignore-scripts

      # Gate on dependencies that ship in dist/. Dev-only tooling advisories are
      # tracked via Dependabot but never reach users.
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify committed dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit."
            git diff --stat
            exit 1
          fi
